version: '3.2'

services:
  nginx:
    container_name: nginx
    image: nginx:1.15-alpine
    restart: unless-stopped
    hostname: iot.glatzer.eu
    ports:
      - "80:80"
      - "443:443"
    secrets:
     - cert_file
     - cert_key
     - trusted_cert_file
    depends_on:
      - grafana
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf:ro
      - ./dhparams.pem:/etc/letsencrypt/dhparams.pem:ro
    networks:
      iotnet:    
        aliases:
          - iot.glatzer.eu

  influxdb:
    container_name: influxdb
    image: influxdb
    restart: unless-stopped
    hostname: influxdb.iot.glatzer.eu
    ports:
      - "8086:8086"
    volumes:
      - /data/influxdb:/var/lib/influxdb2:rw
    secrets:
     - cert_file
     - cert_key
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_USER_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=jg
      - DOCKER_INFLUXDB_INIT_BUCKET=sensordata
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_HTTP_HTTPS_ENABLED=true
      - INFLUXDB_HTTP_HTTPS_CERTIFICATE=/run/secrets/cert_file
      - INFLUXDB_HTTP_HTTPS_PRIVATE_KEY=/run/secrets/cert_key
    networks:
      iotnet:    
        aliases:
          - influxdb.iot.glatzer.eu

  telegraf:
    container_name: telegraf
    image: telegraf
    restart: unless-stopped
    hostname: telegraf.iot.glatzer.eu
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf
    environment:
      - TELEGRAF_INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - TELEGRAF_MQTT_USER=${TELEGRAF_MQTT_USER}
      - TELEGRAF_MQTT_PASSWORD=${TELEGRAF_MQTT_PASSWORD}
    depends_on:
      - influxdb
      - mqtt
    networks:
      iotnet:
        aliases:
          - telegraf.iot.glatzer.eu

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    hostname: grafana.iot.glatzer.eu
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /data/grafana:/var/lib/grafana:rw
    depends_on:
      - influxdb
    secrets:
     - cert_file
     - cert_key
    environment:
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_CERT_FILE=/run/secrets/cert_file
      - GF_SERVER_CERT_KEY=/run/secrets/cert_key
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=iot.glatzer.eu
      - GF_SERVER_ROOT_URL=https://iot.glatzer.eu/
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Grafana
      - GF_NOTIFICATION_EMAIL=${GF_NOTIFICATION_EMAIL}
      - GF_TELEGRAM_BOT_TOKEN=${GF_TELEGRAM_BOT_TOKEN}
      - GF_TELEGRAM_CHAT_ID=${GF_TELEGRAM_CHAT_ID}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - MARIADB_GRAFANA_PASSWORD=${MARIADB_GRAFANA_PASSWORD}
    networks:
      iotnet:    
        aliases:
          - grafana.iot.glatzer.eu

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    hostname: mqtt.iot.glatzer.eu
    ports:
      - "1883:1883"
      - "8883:8883"
    secrets:
     - cert_key
     - mosquitto_passwd
    volumes:
      - /secrets/certbot/live/iot.glatzer.eu/fullchain.pem:/mosquitto/secrets/fullchain.pem:ro
      - /secrets/certbot/live/iot.glatzer.eu/privkey.pem:/mosquitto/secrets/privkey.pem:ro
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:rw
      - ./dhparams.pem:/etc/letsencrypt/dhparams.pem:ro
      - /data/mqtt/log:/mosquitto/log:rw
      - /data/mqtt/data:/mosquitto/data:rw
    networks:
      iotnet:
        aliases:
          - mqtt.iot.glatzer.eu

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma
    restart: unless-stopped
    hostname: uptime-kuma.iot.glatzer.eu
    ports:
      - "3001:3001"
    volumes:
      - /data/uptime-kuma:/app/data
    networks:
      iotnet:
        aliases:
          - update-kuma.iot.glatzer.eu


  mariadb:
    container_name: mariadb
    image: mariadb:11.4
    restart: unless-stopped
    hostname: mariadb.iot.glatzer.eu
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/mariadb:/var/lib/mysql:rw
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      - TZ=Europe/Paris
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=altherma4
      - MARIADB_USER=altherma4
      - MARIADB_PASSWORD=${ALTHERMA_DB_PASSWORD}
      - MARIADB_GRAFANA_PASSWORD=${MARIADB_GRAFANA_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      iotnet:
        aliases:
          - mariadb.iot.glatzer.eu

  # Daikin Altherma 4: read Modbus TCP (FC 0x01-0x04 only) -> MariaDB + InfluxDB 2
  # Uses the InfluxDB admin token (like telegraf/grafana), but not the MariaDB root password.
  altherma4:
    container_name: altherma4
    build: ./altherma4
    image: altherma4-logger:latest
    restart: unless-stopped
    hostname: altherma4.iot.glatzer.eu
    depends_on:
      - mariadb
      - influxdb
    environment:
      - TZ=Europe/Paris
      - ALTHERMA_HOST=${ALTHERMA_HOST:?set ALTHERMA_HOST in .env}
      - ALTHERMA_PORT=${ALTHERMA_PORT:-502}
      - ALTHERMA_UNIT_ID=${ALTHERMA_UNIT_ID:-1}
      - POLL_INTERVAL=${POLL_INTERVAL:-15}
      - QUIET=1
      - MYSQL_HOST=mariadb.iot.glatzer.eu
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=altherma4
      - MYSQL_USER=altherma4
      - MYSQL_PASSWORD=${ALTHERMA_DB_PASSWORD}
      - INFLUXDB_URL=http://influxdb.iot.glatzer.eu:8086
      - INFLUXDB_ORG=jg
      - INFLUXDB_BUCKET=${ALTHERMA_INFLUXDB_BUCKET:-sensordata}
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_MEASUREMENT=altherma4
      - TELEGRAM_BOT_TOKEN=${GF_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${GF_TELEGRAM_CHAT_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_SECURITY=${ALTHERMA_SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM=${SMTP_FROM_ADDRESS}
      - MAIL_TO=${GF_NOTIFICATION_EMAIL}
      - ALERT_NAME=Altherma 4
      - ALERT_PRESSURE_MIN=${ALERT_PRESSURE_MIN:-0.9}
      - ALERT_PRESSURE_DROP=${ALERT_PRESSURE_DROP:-0.2}
      - ALERT_PRESSURE_PUMP_TOL=${ALERT_PRESSURE_PUMP_TOL:-5}
      - ALERT_BUH_MIN=${ALERT_BUH_MIN:-10}
      - ALERT_BUH_KWH_DAY=${ALERT_BUH_KWH_DAY:-2}
      - ALERT_STARTS_PER_HOUR=${ALERT_STARTS_PER_HOUR:-3}
      - ALERT_LWT_DEV=${ALERT_LWT_DEV:-5}
      - ALERT_LWT_MIN=${ALERT_LWT_MIN:-30}
      - ALERT_FLOW_MIN=${ALERT_FLOW_MIN:-3}
      - ALERT_DEFROST_MAX_MIN=${ALERT_DEFROST_MAX_MIN:-15}
      - ALERT_DEFROST_PER_HOUR=${ALERT_DEFROST_PER_HOUR:-2}
      - ALERT_DB_MIN=${ALERT_DB_MIN:-30}
      - ALERT_FROST=${ALERT_FROST:-0}
      - ALERT_FROST_WATER_MIN=${ALERT_FROST_WATER_MIN:-10}
      - SEC_SUPPLY_SOURCE=${SEC_SUPPLY_SOURCE:-}
      - SEC_RETURN_SOURCE=${SEC_RETURN_SOURCE:-}
      - SEC_SUPPLY_OFFSET=${SEC_SUPPLY_OFFSET:-0}
      - SEC_RETURN_OFFSET=${SEC_RETURN_OFFSET:-0}
      - ALERT_HYD_MIN=${ALERT_HYD_MIN:-60}
      - HEARTBEAT_URL=${ALTHERMA_HEARTBEAT_URL:-}
      - REPORT_WEEKDAY=${REPORT_WEEKDAY:-1}
      - REPORT_HOUR=${REPORT_HOUR:-7}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      iotnet:
        aliases:
          - altherma4.iot.glatzer.eu

secrets:
  cert_file:
    file: /secrets/certbot/live/iot.glatzer.eu/fullchain.pem
  cert_key:
    file: /secrets/certbot/live/iot.glatzer.eu/privkey.pem
  trusted_cert_file:
    file: /secrets/certbot/live/iot.glatzer.eu/chain.pem
  mosquitto_passwd:
    file: /secrets/mosquitto_passwd

networks:
  iotnet:
