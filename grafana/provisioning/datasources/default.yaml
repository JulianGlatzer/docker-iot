apiVersion: 1
 
datasources:
  - name: InfluxDB
    type: influxdb
    uid: influxdb-sensordata
    access: proxy
    url: http://influxdb.iot.glatzer.eu:8086
    jsonData:
      version: Flux
      organization: jg
      defaultBucket: sensordata
    secureJsonData:
      token: "${INFLUXDB_ADMIN_TOKEN}"
    isDefault: true
    editable: false
