# Grafana alert rule provisioning
# All rules share the same logic:
#   Query the last 24h for a specific field. If the result is empty → ALERT.
#
# Interval: evaluated every 1h (3600s), for_duration: 0s means alert fires
# immediately on the first evaluation that returns no data, no grace period.
#
# datasourceUid must match the uid in datasources/influxdb.yaml

apiVersion: 1

groups:

  # ---------------------------------------------------------------------------
  # electricity – ZLinky Zigbee energy meter
  # ---------------------------------------------------------------------------
  - name: electricity
    orgId: 1
    folder: IoT Alerts
    interval: 1h
    rules:

      - uid: alert-elec-hchp
        title: "electricity: HCHP no data 24h"
        condition: no_data_condition
        for: 0s
        annotations:
          summary: "No HCHP (peak hours index) received in the last 24 hours."
        labels:
          measurement: electricity
          field: HCHP
        data:
          - refId: A
            datasourceUid: influxdb-sensordata
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              query: |
                from(bucket: "sensordata")
                  |> range(start: -24h)
                  |> filter(fn: (r) => r._measurement == "electricity" and r._field == "HCHP")
                  |> last()
          - refId: no_data_condition
            datasourceUid: "-100"
            model:
              type: classic_conditions
              conditions:
                - evaluator: {type: no_value, params: []}
                  operator:  {type: and}
                  query:     {params: [A]}
                  reducer:   {type: last}

