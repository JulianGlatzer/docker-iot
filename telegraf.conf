# =============================================================================
# Telegraf Configuration
# =============================================================================
# Environment variables required:
#   TELEGRAF_MQTT_USER         - MQTT username
#   TELEGRAF_MQTT_PASSWORD     - MQTT password
#   TELEGRAF_INFLUXDB_TOKEN    - InfluxDB2 API token

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true


# =============================================================================
# INPUT: single MQTT consumer for all topics
#
# topic_tag stores the full topic string as a tag on every metric, e.g.:
#   mqtt_topic = "tele/tasmota_9D5F72/SENSOR"
#   mqtt_topic = "watermeter/main/json"
#
# All messages arrive as measurement "mqtt_raw" with a single field "value"
# containing the raw JSON string. The Starlark processor below does all
# parsing and routing based on the mqtt_topic tag.
# =============================================================================
[[inputs.mqtt_consumer]]
  servers   = ["tcp://mqtt.iot.glatzer.eu:1883"]
  topics    = [
    "tele/+/SENSOR",
    "watermeter/main/json",
  ]
  client_id = "telegraf"
  username  = "${TELEGRAF_MQTT_USER}"
  password  = "${TELEGRAF_MQTT_PASSWORD}"

  topic_tag     = "mqtt_topic"
  name_override = "mqtt_raw"

  data_format = "value"
  data_type   = "string"


# =============================================================================
# PROCESSOR: single Starlark processor handles all topics
#
# Add a new elif branch in apply() for every new topic pattern you need.
# The helper functions at the top keep each handler self-contained.
#
# Tasmota ZbReceived routing:
#   Messages are routed to a measurement based on which fields are present.
#   ZB_FIELD_MEASUREMENT maps every known field name → measurement name.
#   Add new fields here as you discover new sensor types — no other change
#   needed.
#
#   Special field handling:
#   - Endpoint, LinkQuality            → always dropped (ZB_IGNORED)
#   - HCHP, HCHC                       → hex string decoded to int (Wh)
#   - Device, Name                     → become tags, not fields
# =============================================================================
[[processors.starlark]]
  namepass = ["mqtt_raw"]

  source = '''
load("json.star", "json")

# ---------------------------------------------------------------------------
# Fields to silently drop from every ZbReceived message
# ---------------------------------------------------------------------------
ZB_IGNORED = {
    "Endpoint":    True,
    "LinkQuality": True,
}

# ---------------------------------------------------------------------------
# Routing table: field name → measurement name
#
# The first matching field in a payload decides the measurement.
# Add a new entry here whenever a new sensor type appears.
# ---------------------------------------------------------------------------
ZB_FIELD_MEASUREMENT = {
    # Electricity meter (ZLinky via Tasmota Zigbee)
    "IINST1": "electricity",
    "IINST2": "electricity",
    "IINST3": "electricity",
    "PAPP":   "electricity",
    "HCHP":   "electricity",
    "HCHC":   "electricity",

    # Temperature / humidity sensors
    "Temperature": "temperature",
    "Humidity":    "temperature",
}

# ---------------------------------------------------------------------------
# Fields that need hex-string → int decoding ("0x000001..." → integer)
# ---------------------------------------------------------------------------
ZB_HEX_FIELDS = {
    "HCHP": True,
    "HCHC": True,
}

# ---------------------------------------------------------------------------
# resolve_measurement: inspect the payload fields and return the measurement
# name, or None if no known field is found.
# ---------------------------------------------------------------------------
def resolve_measurement(device_data):
    for k in device_data:
        if k in ZB_FIELD_MEASUREMENT:
            return ZB_FIELD_MEASUREMENT[k]
    return None

# ---------------------------------------------------------------------------
# handle_tasmota_zigbee: parses a tele/+/SENSOR ZbReceived payload.
#
# Returns a list with one metric routed to the correct measurement,
# or an empty list if the payload is unrecognised or contains no data fields.
# ---------------------------------------------------------------------------
def handle_tasmota_zigbee(metric, board_id):
    raw = metric.fields.get("value", "")
    if not raw:
        return []

    data = json.decode(raw)

    zbr = data.get("ZbReceived", None)
    if zbr == None:
        return []

    # ZbReceived contains exactly one key: the short Zigbee address
    device_data = None
    for addr in zbr:
        device_data = zbr[addr]
        break
    if device_data == None:
        return []

    measurement = resolve_measurement(device_data)
    if measurement == None:
        # Unknown sensor type – drop silently.
        # Change to forward the raw metric here for debugging if needed.
        return []

    device_id   = device_data.get("Device", "unknown")   # e.g. "0x99A2"
    device_name = device_data.get("Name",   "unknown")   # e.g. "ZLinky"

    out = Metric(measurement)
    out.time = metric.time
    out.tags["board_id"]     = board_id
    out.tags["device_id"]    = device_id
    out.tags["device_name"]  = device_name

    has_fields = False
    for k in device_data:
        if k in ("Device", "Name"):
            continue
        if k in ZB_IGNORED:
            continue

        v = device_data[k]

        if k in ZB_HEX_FIELDS:
            if type(v) == "string" and v.startswith("0x"):
                v = int(v, 16)
            out.fields[k] = int(v)
        elif type(v) == "int" or type(v) == "float":
            out.fields[k] = v
        else:
            out.fields[k] = str(v)

        has_fields = True

    if not has_fields:
        return []

    return [out]


# ---------------------------------------------------------------------------
# Board-id to human-readable device name.
# Add a new entry here whenever a new board is deployed.
# ---------------------------------------------------------------------------
BOARD_NAMES = {
    "tasmota_37D9E4": "Waschkueche",
}

def board_device_name(board_id):
    return BOARD_NAMES.get(board_id, board_id)


# ---------------------------------------------------------------------------
# handle_tasmota_sensor: parses a flat tele/+/SENSOR payload (no ZbReceived).
#
# Payload structure:
#   DS18B20-1  → heating.departure_temperature
#   DS18B20-2  → heating.return_temperature
#   BME280     → temperature.Temperature / Humidity / DewPoint / Pressure
#   COUNTER, ESP32, Time, PressureUnit, TempUnit → ignored
#
# board_id is extracted from the topic by the caller.
# Returns a list of 0–2 metrics depending on which keys are present.
# ---------------------------------------------------------------------------
def handle_tasmota_sensor(metric, board_id):
    raw = metric.fields.get("value", "")
    if not raw:
        return []

    data = json.decode(raw)
    results = []

    device_name = board_device_name(board_id)

    # --- heating measurement (DS18B20 probes) --------------------------------
    # One metric that may carry both fields if both probes are present.
    heating = Metric("heating")
    heating.time = metric.time
    heating.tags["board_id"]    = board_id
    heating.tags["device_id"]   = board_id
    heating.tags["device_name"] = device_name
    heating_has_fields = False

    ds1 = data.get("DS18B20-1", None)
    if ds1 != None:
        t = ds1.get("Temperature", None)
        if t != None:
            heating.fields["departure_temperature"] = float(t)
            heating_has_fields = True

    ds2 = data.get("DS18B20-2", None)
    if ds2 != None:
        t = ds2.get("Temperature", None)
        if t != None:
            heating.fields["return_temperature"] = float(t)
            heating_has_fields = True

    if heating_has_fields:
        results.append(heating)

    # --- temperature measurement (BME280) ------------------------------------
    bme = data.get("BME280", None)
    if bme != None:
        env = Metric("temperature")
        env.time = metric.time
        env.tags["board_id"]    = board_id
        env.tags["device_id"]   = board_id
        env.tags["device_name"] = device_name
        env_has_fields = False

        for field in ("Temperature", "Humidity", "DewPoint", "Pressure"):
            v = bme.get(field, None)
            if v != None:
                env.fields[field] = float(v)
                env_has_fields = True

        if env_has_fields:
            results.append(env)

    return results


# ---------------------------------------------------------------------------
# handle_watermeter: parses watermeter/main/json payload.
#
# Expected payload:
#   { "value": "347.1305", "raw": "00347.1305", "pre": "...",
#     "error": "no error", "rate": "0.000000",
#     "timestamp": "2026-05-18T23:28:11+0200" }
#
# Only "value" and "rate" are stored as float fields.
# All other keys are ignored.
# ---------------------------------------------------------------------------
def handle_watermeter(metric):
    raw_str = metric.fields.get("value", "")
    if not raw_str:
        return []

    data = json.decode(raw_str)

    out = Metric("watermeter")
    out.time = metric.time
    out.tags["device_name"] = "house_meter"

    has_fields = False

    v = data.get("value", None)
    if v != None:
        out.fields["value"] = float(v)
        has_fields = True

    r = data.get("rate", None)
    if r != None:
        out.fields["rate"] = float(r)
        has_fields = True

    if not has_fields:
        return []

    return [out]


# ---------------------------------------------------------------------------
# apply: entry point called by Telegraf for every metric
# ---------------------------------------------------------------------------
def apply(metric):
    topic = metric.tags.get("mqtt_topic", "")

    # --- Tasmota tele/+/SENSOR -----------------------------------------------
    #
    # A quick string check on the raw payload decides which handler to call:
    #   ZbReceived present  → handle_tasmota_zigbee  (Zigbee sensor wrapper)
    #   ZbReceived absent   → handle_tasmota_sensor  (flat sensor payload)
    # board_id is always derived from the topic, never hardcoded.

    if topic.startswith("tele/") and topic.endswith("/SENSOR"):
        board_id = topic.split("/")[1]
        raw = metric.fields.get("value", "")
        if raw and "ZbReceived" in raw:
            return handle_tasmota_zigbee(metric, board_id)
        else:
            return handle_tasmota_sensor(metric, board_id)

    elif topic == "watermeter/main/json":
        return handle_watermeter(metric)

    # Unknown topic: drop silently.
    # Change to [metric] here to forward raw values to InfluxDB for debugging.
    return []
'''


# =============================================================================
# OUTPUT: single InfluxDB v2 output – receives all processed measurements
# =============================================================================
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb.iot.glatzer.eu:8086"]
  token        = "${TELEGRAF_INFLUXDB_TOKEN}"
  organization = "jg"
  bucket       = "sensordata"
